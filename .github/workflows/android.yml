name: Android verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: chmod +x gradlew
      - run: ./gradlew :app:assembleDebug :app:assembleRelease :app:lintDebug :core:testDebugUnitTest :platform:testDebugUnitTest :platform:assembleDebugAndroidTest --max-workers=2
      - run: python scripts/validate_iap_catalog.py
      - run: python scripts/audit_native_alignment.py --apk app/build/outputs/apk/release/app-release-unsigned.apk --output app/build/native-page-alignment.json
      - run: python scripts/localization.py validate
      - run: python -m unittest scripts/localization_test.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-verification
          path: |
            app/build/outputs/apk/
            **/build/reports/
            **/build/test-results/
            localization/validation-report.json

